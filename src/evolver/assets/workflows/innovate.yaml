# Innovate cycle — EvoX-harvested workflow template (v1.110.0).
#
# Exploration loop: the host executor attempts a novel improvement (no repair
# bias), the engine gates it through the validation cascade (failure is
# tolerated and recorded — innovation ROI bookkeeping), and a human decides
# whether to keep it.
id: innovate-cycle
name: Innovate cycle
description: Novel improvement attempt with cascade gate and keep-or-drop approval
steps:
  - kind: agent
    role: innovator
    description: Attempt one novel, non-repair improvement on the weakest metric
    instruction: >-
      Pick the weakest signal from the last self-report (memory/evolution/
      self_report.json) and prototype ONE novel improvement addressing it.
      Prefer additive changes; keep the blast radius small.
  - kind: gate
    description: Validation cascade (ruff → mypy → pytest)
    on_fail: skip
  - kind: approval
    risk_reason: keep the innovation (or drop it — both outcomes are recorded)
    description: Approve to solidify; reject to discard and record the attempt as ROI data
